# AI 学习中心 · 可安装工具注册表（SSOT）
# 消费流程见 docs/CONSUME.md · 查询 scripts/query-tools.sh · 安装 scripts/install-tool.sh
# 新增工具：录入此处 + 对应 notes/ 笔记 + 更新 docs/INDEX.md

version: "1.0"

tools:
  - id: taste-skill
    name: Taste Skill
    summary: >-
      Agent Skill 设计导演手册：生成前 brief inference、三拨盘（布局/动效/密度）、
      设计系统映射与 anti-slop 规则，适合从零做 landing / portfolio。
    kb_id: KB-AI-20260608-taste-skill-agent-frontend
    note_path: notes/ai-tools/frontend-design/2026-06-08-taste-skill-agent-frontend.md
    homepage: https://github.com/Leonxlnx/taste-skill
    module: ai-tools
    intents:
      - frontend-design
      - anti-slop
      - landing-page
      - portfolio
      - agent-skill
      - ui-generation
      - redesign
    keywords:
      - taste-skill
      - taste
      - design-taste-frontend
      - slop
      - 审美
      - 好看
      - 前端界面
      - cursor
      - codex
      - claude
    agents: [cursor, claude-code, codex, chatgpt]
    pairs_with: [impeccable]
    install:
      default_method: npx-default
      methods:
        - id: npx-default
          label: "默认 design-taste-frontend (v2 experimental)"
          type: shell
          scope: project
          command: npx skills add https://github.com/Leonxlnx/taste-skill --skill "design-taste-frontend"
        - id: npx-all
          label: "安装全部技能"
          type: shell
          scope: project
          command: npx skills add https://github.com/Leonxlnx/taste-skill
        - id: npx-v1
          label: "固定 v1 行为"
          type: shell
          scope: project
          command: npx skills add https://github.com/Leonxlnx/taste-skill --skill "design-taste-frontend-v1"
        - id: paste
          label: "粘贴 SKILL 到对话（无需 CLI）"
          type: manual
          scope: project
          instructions: >-
            从 https://github.com/Leonxlnx/taste-skill 复制 skills/taste-skill/SKILL.md，
            粘贴到 Cursor / ChatGPT 对话，并在任务中写 Follow design-taste-frontend skill。
    usage_prompt: |
      Follow the design-taste-frontend skill. Build a landing page.
      Brand: precise, restrained, developer-friendly — closer to GitHub Primer than generic AI gradients.

  - id: impeccable
    name: impeccable.style
    summary: >-
      设计「词典」+ 20 个斜杠命令（/audit /polish /colorize 等）：
      诊断并迭代抛光已有 AI 页面，解决 Inter+灰底+卡片套娃等 slop 问题。
    kb_id: KB-AI-20260608-impeccable-style-frontend-design
    note_path: notes/ai-tools/frontend-design/2026-06-08-impeccable-style-frontend-design.md
    homepage: https://impeccable.style
    module: ai-tools
    intents:
      - frontend-design
      - anti-slop
      - polish
      - audit
      - slash-commands
      - ui-refinement
      - landing-page
    keywords:
      - impeccable
      - pbakaus
      - paul bakaus
      - audit
      - polish
      - colorize
      - 好看
      - 审美
      - 前端界面
      - slop
      - 斜杠命令
    agents: [cursor, claude-code, codex, gemini-cli]
    pairs_with: [taste-skill]
    install:
      default_method: cursor-project
      requires_download:
        url: https://impeccable.style
        hint: "从官网下载 ZIP 并解压到临时目录，设置 IMPPECCABLE_DIST 指向解压后的 dist 目录"
      methods:
        - id: cursor-project
          label: "Cursor 项目级"
          type: shell
          scope: project
          agent: cursor
          command: 'cp -r "${IMPECCABLE_DIST:?请设置 IMPECCABLE_DIST}/cursor/.cursor" "${TARGET:-.}/"'
        - id: claude-project
          label: "Claude Code 项目级"
          type: shell
          scope: project
          agent: claude-code
          command: 'cp -r "${IMPECCABLE_DIST:?请设置 IMPECCABLE_DIST}/claude-code/.claude" "${TARGET:-.}/"'
        - id: codex-project
          label: "Codex CLI 项目级"
          type: shell
          scope: project
          agent: codex
          command: 'cp -r "${IMPECCABLE_DIST:?请设置 IMPECCABLE_DIST}/codex-cli/.codex" "${TARGET:-.}/"'
        - id: claude-global
          label: "Claude Code 全局"
          type: shell
          scope: global
          agent: claude-code
          command: 'cp -r "${IMPECCABLE_DIST:?请设置 IMPECCABLE_DIST}/claude-code/.claude/"* "${HOME}/"'
    usage_prompt: |
      已安装 impeccable。请按序执行：/audit 诊断 → /distill 简化 → /colorize 配色 → /polish 收尾。
      然后根据我的需求继续：{用户补充的场景描述}

  - id: anthropic-frontend-design
    name: Anthropic Frontend Design Skill
    summary: >-
      Anthropic 官方 agent skill：生成前 Design Thinking + 美学方向（aesthetic direction），
      规避 Inter/紫渐变等 AI slop；Claude Code 插件或 npx 安装。
    kb_id: KB-AI-20260608-anthropic-frontend-design-skill
    note_path: notes/ai-tools/frontend-design/2026-06-08-anthropic-frontend-design-skill.md
    homepage: https://github.com/anthropics/skills/tree/main/skills/frontend-design
    module: ai-tools
    intents:
      - frontend-design
      - anti-slop
      - ui-generation
      - agent-skill
      - claude-code
    keywords:
      - anthropic
      - frontend-design
      - claude-code
      - aesthetic-direction
      - coolors
      - 好看
      - 审美
      - 前端界面
      - slop
      - minimax
    agents: [claude-code, cursor, codex]
    pairs_with: [taste-skill, impeccable]
    install:
      default_method: claude-plugin
      methods:
        - id: claude-plugin
          label: "Claude Code 插件（推荐）"
          type: manual
          scope: global
          agent: claude-code
          instructions: >-
            在 Claude Code 中执行 /plugin → Add Marketplace → 输入 anthropics/claude-code
            → Browse and install plugins → 安装 frontend-design。
        - id: npx-skill
          label: "npx skills add（Cursor/Codex 等）"
          type: shell
          scope: project
          command: npx skills add https://github.com/anthropics/skills --skill frontend-design
        - id: paste
          label: "粘贴 SKILL.md 到对话"
          type: manual
          scope: project
          instructions: >-
            从 https://github.com/anthropics/skills/blob/main/skills/frontend-design/SKILL.md
            复制全文到对话，任务末尾写 use frontend-design skill。
    usage_prompt: |
      use frontend-design skill
      use aesthetic direction: {Minimalism|Dark Mode|organic/natural|…}
      color palette: {从 coolors.co 复制的 CSS 变量}
      {你的页面需求}

  - id: awesome-design-md
    name: awesome-design-md
    summary: >-
      73 个顶级品牌 DESIGN.md 合集（Stripe/Linear/Apple 等）：复制到项目根目录，
      让 Cursor/Claude Code/Stitch 按精确设计变量生成风格一致的 UI；MIT，零依赖。
    kb_id: KB-AI-20260608-awesome-design-md-agent-ui
    note_path: notes/ai-tools/frontend-design/2026-06-08-awesome-design-md-agent-ui.md
    homepage: https://github.com/VoltAgent/awesome-design-md
    module: ai-tools
    intents:
      - frontend-design
      - anti-slop
      - design-system
      - ui-generation
      - landing-page
    keywords:
      - awesome-design-md
      - design-md
      - design.md
      - getdesign
      - voltagent
      - stripe
      - linear
      - 设计系统
      - 好看
      - 审美
      - 前端界面
      - slop
    agents: [cursor, claude-code, google-stitch, windsurf, codex]
    pairs_with: [taste-skill, anthropic-frontend-design, impeccable]
    install:
      default_method: copy-design-md
      methods:
        - id: copy-design-md
          label: "复制品牌 DESIGN.md 到项目根目录"
          type: manual
          scope: project
          instructions: >-
            从 https://github.com/VoltAgent/awesome-design-md 选定品牌目录，
            将 DESIGN.md 复制到目标项目根目录；对话中写「请严格遵循 DESIGN.md 实现页面」。
        - id: clone-repo
          label: "克隆仓库后按需复制"
          type: shell
          scope: project
          command: git clone https://github.com/VoltAgent/awesome-design-md.git
    usage_prompt: |
      请严格遵循项目根目录 DESIGN.md 中的设计系统实现：{页面需求}
      使用文档色板与组件规范，禁止默认 AI 模板配色。

# 意图 → 推荐工具（用于 /kb-recommend 无关键词时的默认映射）
intent_aliases:
  好看的前端: [frontend-design, anti-slop, ui-generation]
  前端审美: [frontend-design, anti-slop]
  前端工具汇总: [awesome-list, frontend-design, anti-slop, ui-generation]
  工具汇总: [awesome-list, frontend-design]
  前端工具有哪些: [awesome-list, frontend-design]
  ai slop: [anti-slop, polish]
  落地页: [landing-page, frontend-design]
  landing page: [landing-page, frontend-design]
